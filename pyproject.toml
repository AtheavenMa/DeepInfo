[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepinfo-research"
version = "0.1.0"
description = "CID and reconstruction uncertainty for neural-network representations"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Haotian Ma" }]
license = { text = "MIT" }
keywords = ["interpretability", "information discarding", "representation learning", "CID", "RU"]
dependencies = ["torch>=2.2", "numpy>=1.24"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
demo = ["matplotlib>=3.7"]
test = ["pytest>=7.0", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/AtheavenMa/DeepInfo"
Paper = "https://proceedings.mlr.press/v162/ma22b.html"

[tool.setuptools.packages.find]
include = ["deepinfo*"]
